name: Deploy to Production

on:
  push:
    branches:
      - dev
    paths:
      - '**'

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    environment: production

    steps:
      - name: Deploy Application
        run: |
          echo "=== Pull changes ==="
          cd /home/kangudin/pos-kasirpro
          git pull origin dev 2>&1

          echo "=== Sync to deployment ==="
          rsync -av --exclude=.env --exclude=storage --exclude=vendor . /opt/homelab/apps/kasirpro/

          echo "=== Composer install ==="
          docker exec kasirpro-app bash -c 'cd /var/www/html && composer install --no-interaction --prefer-dist --optimize-autoloader 2>&1' || echo "composer skipped"

          echo "=== Run migrations ==="
          docker exec kasirpro-app php artisan migrate --force 2>&1 || echo "migrate skipped"

          echo "=== Optimize ==="
          docker exec kasirpro-app php artisan optimize:clear 2>&1 || echo "optimize skipped"

          echo "=== Restart app ==="
          docker compose -f /opt/homelab/apps/kasirpro/docker-compose.prod.yml restart app 2>&1

          echo "=== Deploy complete ==="
