name: Deploy to Production

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2312 10.88.12.3 >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/deploy_key -p 2312 kangudin@10.88.12.3 '
            echo "SSH_OK"
            cd /home/kangudin/pos-kasirpro
            git pull origin dev
            rsync -av --exclude=.env --exclude=storage --exclude=vendor . /opt/homelab/apps/kasirpro/
            cd /opt/homelab/apps/kasirpro
            docker compose -f docker-compose.prod.yml exec -T app composer install --no-interaction --prefer-dist --optimize-autoloader || true
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force || true
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear || true
            docker compose -f docker-compose.prod.yml restart app
          '
