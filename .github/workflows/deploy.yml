name: Deploy to Production

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 10.88.12.3
          port: 2312
          username: kangudin
          key: ${{ secrets.DEPLOY_KEY }}
          host_key_checking: false
          script: |
            set -e
            echo "=== Update repo ==="
            cd /home/kangudin/pos-kasirpro
            git pull origin dev

            echo "=== Sync files ==="
            rsync -av --exclude='.env' --exclude='storage/*' --exclude='vendor/*' . /opt/homelab/apps/kasirpro/

            echo "=== Deploy ==="
            cd /opt/homelab/apps/kasirpro
            docker compose -f docker-compose.prod.yml exec -T app composer install --no-interaction --prefer-dist --optimize-autoloader || echo "composer skipped"
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force || echo "migrate skipped"
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear || echo "optimize skipped"
            docker compose -f docker-compose.prod.yml restart app
            echo "=== Deploy completed ==="
